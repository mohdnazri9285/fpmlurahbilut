<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPMSB Lurah Bilut - Merumput</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>🌴 FPMSB</h1>
            <small>Lurah Bilut</small>
        </div>
        <ul class="sidebar-nav">
            <li><a href="index.html"><span class="icon">📊</span> <span>Dashboard</span></a></li>
            <li><a href="hasil.html"><span class="icon">📈</span> <span>Hasil</span></a></li>
            <li><a href="pembajaan.html"><span class="icon">🧪</span> <span>Pembajaan</span></a></li>
            <li><a href="merumput.html" class="active"><span class="icon">🌿</span> <span>Merumput</span></a></li>
            <li><a href="mekanisasi.html"><span class="icon">🔧</span> <span>Mekanisasi</span></a></li>
            <li class="divider"></li>
            <li><a href="admin.html"><span class="icon">⚙️</span> <span>Admin</span></a></li>
        </ul>
    </aside>

    <main class="main-content">

        <div class="page-header">
            <div>
                <h1>🌿 Merumput</h1>
                <p style="color: #888; font-size: 14px;">Data aktiviti merumput mengikut pusingan</p>
            </div>
            <div class="date" id="currentDate"></div>
        </div>

        <!-- Filter -->
        <div class="filters">
            <label>Pusingan:</label>
            <select id="pusinganSelect">
                <option value="1">Pusingan 1</option>
                <option value="2">Pusingan 2</option>
                <option value="3">Pusingan 3</option>
            </select>
            <button class="btn btn-primary" onclick="loadMerumput()">Tapis</button>
        </div>

        <!-- Stats -->
        <div class="cards-grid" id="merumputStats">
            <div class="card">
                <div class="label">Jumlah Luas</div>
                <div class="value" id="mLuas">0 Ha</div>
            </div>
            <div class="card">
                <div class="label">Siap</div>
                <div class="value" id="mSiap">0 Ha</div>
            </div>
            <div class="card">
                <div class="label">% Siap</div>
                <div class="value" id="mPeratus">0%</div>
            </div>
        </div>

        <!-- Table -->
        <div class="table-container">
            <h3>📋 Butiran Merumput</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Peringkat</th>
                            <th class="text-right">Luas (Ha)</th>
                            <th class="text-right">Pusingan 1</th>
                            <th class="text-right">Pusingan 2</th>
                            <th class="text-right">Pusingan 3</th>
                        </tr>
                    </thead>
                    <tbody id="merumputTableBody">
                        <tr><td colspan="5" class="text-center" style="padding:20px;color:#888;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="js/supabase.js"></script>
    <script>
        let merumputData = [];

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('currentDate').textContent = formatDate(new Date());
            loadMerumputData();
        });

        document.getElementById('pusinganSelect').addEventListener('change', loadMerumput);

        async function loadMerumputData() {
            try {
                const { data, error } = await supabase
                    .from('merumput')
                    .select('*')
                    .order('peringkat');

                if (error) throw error;
                merumputData = data || [];
                loadMerumput();

            } catch (err) {
                console.error('Error loading merumput:', err);
            }
        }

        function loadMerumput() {
            const pusingan = document.getElementById('pusinganSelect').value;
            const col = `pusingan_${pusingan}`;

            const totalLuas = merumputData.reduce((s, r) => s + (r.luas || 0), 0);
            const totalSiap = merumputData.reduce((s, r) => s + (r[col] || 0), 0);
            const peratus = totalLuas > 0 ? (totalSiap / totalLuas) * 100 : 0;

            document.getElementById('mLuas').innerHTML = totalLuas.toFixed(2) + ' Ha';
            document.getElementById('mSiap').innerHTML = totalSiap.toFixed(2) + ' Ha';
            document.getElementById('mPeratus').textContent = peratus.toFixed(1) + '%';

            const tbody = document.getElementById('merumputTableBody');
            if (merumputData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center" style="padding:20px;color:#888;">Tiada data</td></tr>';
                return;
            }

            tbody.innerHTML = merumputData.map(row => `
                <tr>
                    <td><strong>${row.peringkat || '-'}</strong></td>
                    <td class="text-right">${formatNumber(row.luas)}</td>
                    <td class="text-right">${formatNumber(row.pusingan_1)}</td>
                    <td class="text-right">${formatNumber(row.pusingan_2)}</td>
                    <td class="text-right">${formatNumber(row.pusingan_3)}</td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
