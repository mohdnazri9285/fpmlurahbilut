<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPMSB Lurah Bilut - Mekanisasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-brand">
            <h1>🌴 FPMSB</h1>
            <small>Lurah Bilut</small>
        </div>
        <ul class="sidebar-nav">
            <li><a href="index.html"><span class="icon">📊</span> <span>Dashboard</span></a></li>
            <li><a href="hasil.html"><span class="icon">📈</span> <span>Hasil</span></a></li>
            <li><a href="pembajaan.html"><span class="icon">🧪</span> <span>Pembajaan</span></a></li>
            <li><a href="merumput.html"><span class="icon">🌿</span> <span>Merumput</span></a></li>
            <li><a href="mekanisasi.html" class="active"><span class="icon">🔧</span> <span>Mekanisasi</span></a></li>
            <li class="divider"></li>
            <li><a href="admin.html"><span class="icon">⚙️</span> <span>Admin</span></a></li>
        </ul>
    </aside>

    <main class="main-content">

        <div class="page-header">
            <div>
                <h1>🔧 Mekanisasi</h1>
                <p style="color: #888; font-size: 14px;">Senarai jentera dan peralatan ladang</p>
            </div>
            <div class="date" id="currentDate"></div>
        </div>

        <!-- Jentera Cards -->
        <div class="cards-grid" id="jenteraCards">
            <div class="card" style="text-align:center;padding:30px;color:#888;">Loading jentera...</div>
        </div>

        <!-- Ratio Table -->
        <div class="table-container" style="margin-top:20px;">
            <h3>📋 Nisbah Jentera Penuaian</h3>
            <div style="overflow-x:auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Peringkat</th>
                            <th class="text-right">Luas (Ha)</th>
                            <th class="text-right">Bil. Jentera</th>
                            <th class="text-right">Ratio (Ha/Jentera)</th>
                        </tr>
                    </thead>
                    <tbody id="ratioTableBody">
                        <tr><td colspan="4" class="text-center" style="padding:20px;color:#888;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script src="js/supabase.js"></script>
    <script>
        const iconMap = {
            'KOMODO C700': '🚛',
            'CARABAO G350': '🚛',
            '3-WHEELER': '🛵',
            'TIGER G1500': '🚛',
            'PALM CUTTER': '✂️',
            'TRACTOR MOUNTED SPREADER': '🚜',
            'MISTBLOWER': '💨',
            'TRACTOR MOUNTED GRASSCUTTER': '🌿'
        };

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('currentDate').textContent = formatDate(new Date());
            loadMekanisasi();
        });

        async function loadMekanisasi() {
            try {
                // Load jentera
                const { data: jenteraData, error: jenteraError } = await supabase
                    .from('mekanisasi')
                    .select('*');

                if (!jenteraError && jenteraData) {
                    const cards = document.getElementById('jenteraCards');
                    cards.innerHTML = jenteraData.map(item => `
                        <div class="card" style="display:flex;align-items:center;gap:16px;">
                            <div style="font-size:32px;">${iconMap[item.jentera] || '🔧'}</div>
                            <div>
                                <div style="font-size:12px;color:#888;">${item.aplikasi || 'Ladang'}</div>
                                <div style="font-weight:600;font-size:15px;">${item.jentera}</div>
                                <div style="font-size:13px;color:#555;">${item.jumlah} unit</div>
                            </div>
                        </div>
                    `).join('');
                }

                // Load ratio
                const { data: ratioData, error: ratioError } = await supabase
                    .from('mekanisasi_ratio')
                    .select('*')
                    .order('peringkat');

                const tbody = document.getElementById('ratioTableBody');
                if (ratioError || !ratioData || ratioData.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="text-center" style="padding:20px;color:#888;">Tiada data</td></tr>';
                    return;
                }

                tbody.innerHTML = ratioData.map(row => `
                    <tr>
                        <td><strong>${row.peringkat || '-'}</strong></td>
                        <td class="text-right">${formatNumber(row.luas)}</td>
                        <td class="text-right">${row.bil_jentera || 0}</td>
                        <td class="text-right">${formatNumber(row.ratio)}</td>
                    </tr>
                `).join('');

            } catch (err) {
                console.error('Error loading mekanisasi:', err);
            }
        }
    </script>
</body>
</html>
