<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload CSV - FPMSB Lurah Bilut</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f1f5f9; color: #1e293b; }

        .container { max-width: 900px; margin: 60px auto; padding: 0 24px; }
        .card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        .card h1 { font-size: 2rem; font-weight: 700; color: #0f172a; border-left: 4px solid #2d6a4f; padding-left: 16px; margin-bottom: 24px; }
        .card p { color: #64748b; margin-bottom: 24px; }

        .upload-group { margin-bottom: 30px; border: 1px solid #e2e8f0; border-radius: 16px; padding: 20px; background: #f8fafc; position: relative; }
        .upload-group h3 { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
        .upload-group h3 i { color: #2d6a4f; }
        .upload-group .file-input-wrapper { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
        .upload-group .file-input-wrapper label { font-size: 0.85rem; color: #475569; }
        .upload-group input[type="file"] { padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: white; font-size: 0.8rem; }
        .upload-group .status { font-size: 0.75rem; color: #64748b; margin-top: 8px; font-weight: 600; display: block; }

        .btn-go { display: inline-block; margin-top: 12px; padding: 8px 20px; background: #2d6a4f; color: white; border: none; border-radius: 30px; font-weight: 600; font-size: 0.8rem; text-decoration: none; transition: all 0.2s; }
        .btn-go:hover { background: #1b4d3e; transform: translateY(-2px); }
        .btn-go i { margin-right: 6px; }

        .btn-upload { padding: 14px 32px; background: #2d6a4f; color: white; border: none; border-radius: 40px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; width: 100%; margin-top: 20px; }
        .btn-upload:hover { background: #1b4d3e; transform: translateY(-2px); }

        .btn-group { display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap; }
        .btn-secondary { padding: 10px 24px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 40px; font-weight: 600; font-size: 0.9rem; color: #475569; cursor: pointer; transition: all 0.2s; }
        .btn-secondary:hover { background: #eef2ff; color: #2d6a4f; }
        .btn-home { padding: 10px 24px; background: #2d6a4f; color: white; border: none; border-radius: 40px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; text-decoration: none; display: inline-block; }
        .btn-home:hover { background: #1b4d3e; transform: translateY(-2px); }

        .status-msg { margin-top: 16px; padding: 12px; border-radius: 12px; display: none; }
        .status-msg.success { background: #dcfce7; color: #166534; display: block; }
        .status-msg.error { background: #fee2e2; color: #dc2626; display: block; }
        .status-msg.info { background: #e0f2fe; color: #0369a1; display: block; }

        @media (max-width: 768px) { .card { padding: 24px; } .upload-group .file-input-wrapper { flex-direction: column; align-items: stretch; } .btn-group { flex-direction: column; } }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1><i class="fas fa-upload" style="color: #2d6a4f;"></i> Upload Data CSV ke Supabase</h1>
        <p>Pilih fail CSV dan upload terus ke Supabase. <strong>Semua pengguna akan nampak data yang sama.</strong></p>

        <!-- MEKANISASI -->
        <div class="upload-group">
            <h3><i class="fas fa-tractor"></i> Mekanisasi</h3>
            <div class="file-input-wrapper">
                <input type="file" id="fileMekanisasi" accept=".csv">
                <label>laporan mekanisasi.csv</label>
            </div>
            <span class="status" id="statusMekanisasi">Belum muat naik</span>
            <a href="mekanisasi.html" class="btn-go"><i class="fas fa-arrow-right"></i> Pergi ke Mekanisasi</a>
        </div>

        <!-- MERUMPUT -->
        <div class="upload-group">
            <h3><i class="fas fa-cut"></i> Merumput</h3>
            <div class="file-input-wrapper">
                <input type="file" id="fileMerumput" accept=".csv">
                <label>laporan merumput.csv</label>
            </div>
            <span class="status" id="statusMerumput">Belum muat naik</span>
            <a href="merumput.html" class="btn-go"><i class="fas fa-arrow-right"></i> Pergi ke Merumput</a>
        </div>

        <!-- PEMBAJAAN -->
        <div class="upload-group">
            <h3><i class="fas fa-seedling"></i> Pembajaan</h3>
            <div class="file-input-wrapper">
                <input type="file" id="filePembajaan" accept=".csv">
                <label>laporan pembajaan pusingan.csv</label>
            </div>
            <span class="status" id="statusPembajaan">Belum muat naik</span>
            <a href="pembajaan.html" class="btn-go"><i class="fas fa-arrow-right"></i> Pergi ke Pembajaan</a>
        </div>

        <button class="btn-upload" id="btnUpload">Muat Naik ke Supabase</button>
        <div class="status-msg" id="statusMsg"></div>

        <div class="btn-group">
            <a href="index.html" class="btn-home"><i class="fas fa-home"></i> Kembali ke Halaman Utama</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // =============================================================
    // SUPABASE CONFIG – GUNA NAMA BARU (sb) UNTUK ELak RALAT
    // =============================================================
    const supabaseUrl = 'https://uzwhfoxtykrsmtkafbgh.supabase.co';
    const supabaseKey = 'uzwhfoxtykrsmtkafbgh';
    const sb = supabase.createClient(supabaseUrl, supabaseKey);

    document.getElementById('btnUpload').addEventListener('click', async function() {
        const inputs = [
            { id: 'fileMekanisasi', table: 'mekanisasi', statusId: 'statusMekanisasi' },
            { id: 'fileMerumput', table: 'merumput', statusId: 'statusMerumput' },
            { id: 'filePembajaan', table: 'pembajaan', statusId: 'statusPembajaan' }
        ];

        let uploaded = 0;
        let total = 0;
        let hasError = false;

        for (const { id, table, statusId } of inputs) {
            const input = document.getElementById(id);
            const statusEl = document.getElementById(statusId);
            if (input.files.length > 0) {
                total++;
                const file = input.files[0];
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const csvData = e.target.result;
                        const lines = csvData.split('\n').filter(line => line.trim() !== '');
                        if (lines.length < 2) throw new Error('CSV tidak lengkap');

                        const headers = lines[0].split(',').map(h => h.trim());
                        const data = [];
                        for (let i = 1; i < lines.length; i++) {
                            const values = lines[i].split(',');
                            if (values.every(v => v.trim() === '')) continue;
                            if (values.length !== headers.length) continue;
                            const obj = {};
                            headers.forEach((h, idx) => {
                                obj[h] = values[idx] ? values[idx].trim() : '';
                            });
                            data.push(obj);
                        }

                        const { error } = await sb.from(table).insert(data);
                        if (error) throw error;

                        uploaded++;
                        statusEl.textContent = `✅ ${file.name} berjaya diupload`;
                        statusEl.style.color = '#2d6a4f';
                    } catch (err) {
                        hasError = true;
                        statusEl.textContent = `❌ Gagal: ${err.message}`;
                        statusEl.style.color = '#dc2626';
                    }
                    if (uploaded === total) {
                        if (hasError) {
                            showStatus('⚠️ Beberapa fail gagal diupload. Sila semak semula.', 'error');
                        } else if (total === 0) {
                            showStatus('⚠️ Tiada fail dipilih.', 'info');
                        } else {
                            showStatus(`✅ Berjaya! ${uploaded} fail telah diupload ke Supabase.`, 'success');
                        }
                    }
                };
                reader.readAsText(file);
            }
        }

        if (total === 0) {
            showStatus('ℹ️ Tiada fail dipilih.', 'info');
        }
    });

    function showStatus(msg, type) {
        const el = document.getElementById('statusMsg');
        el.className = 'status-msg ' + type;
        el.textContent = msg;
        setTimeout(() => {
            el.className = 'status-msg';
            el.textContent = '';
        }, 6000);
    }
</script>
</body>
</html>
